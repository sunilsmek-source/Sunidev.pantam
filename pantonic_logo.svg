<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="pantoBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <filter id="brandGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10B981" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Icon Shield -->
  <rect x="8" y="8" width="84" height="84" rx="24" fill="#0F172A" stroke="#1E293B" stroke-width="2.5"/>
  <rect x="9" y="9" width="82" height="82" rx="23" fill="url(#pantoBrandGrad)" fill-opacity="0.08"/>

  <!-- Geometric Glowing "P" with Financial Neural Pulse -->
  <!-- Main P Stem and Upper Bowl -->
  <path d="M32 72 V28 H54 C62.8366 28 70 35.1634 70 44 C70 52.8366 62.8366 60 54 60 H44 V72 H32 Z" 
        fill="none" 
        stroke="url(#pantoBrandGrad)" 
        stroke-width="6.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#brandGlow)"/>

  <!-- Neural Core & Market Growth Nodes -->
  <circle cx="44" cy="44" r="5" fill="#10B981"/>
  <circle cx="70" cy="44" r="3" fill="#06B6D4"/>
  <line x1="32" y1="44" x2="44" y2="44" stroke="#10B981" stroke-width="4" stroke-linecap="round"/>

  <!-- Candlestick Mini Spark Accent -->
  <path d="M54 36 V52" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"/>
</svg>
